name: Build and Push Docker Image

on:
  push:
    paths:
      - 'Dockerfile'


env:
  SUPERSET_VERSION: ${{ vars.SUPERSET_VERSION }}
  DSFR_VERSION: ${{ vars.DSFR_VERSION }}
  DSFR_CHART_VERSION: ${{ vars.DSFR_CHART_VERSION }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-superset
  IMAGE_TAG: >-
    ${{ vars.SUPERSET_VERSION }}${{
      github.ref == 'refs/heads/images' && '-test' || ''
    }}-${{ vars.DSFR_VERSION }}-${{ vars.DSFR_CHART_VERSION }}-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -f Dockerfile \
          --build-arg TAG_DSFR=$DSFR_VERSION \
          --build-arg TAG_DSFR_CHART=$DSFR_CHART_VERSION \
          --build-arg SUPERSET_VERSION=$SUPERSET_VERSION \
          -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/images'
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
