name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      superset_version:
        description: 'Superset version to build (leave empty to use Dockerfile default)'
        required: false
        type: string

  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-img.yaml'
      - superset-dsfr/**/*
  push:
    branches: [main, images]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build-img.yaml'
      - superset-dsfr/**/*

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/apache-superset

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get application version
        id: version
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ inputs.superset_version }}
          VERSION_ARG: SUPERSET_VERSION
          DOCKERFILE: Dockerfile
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            VERSION="$VERSION_OVERRIDE"
          else
            VERSION=$(grep -E "^ARG ${VERSION_ARG}=" "$DOCKERFILE" | head -n1 | cut -d= -f2)
          fi

          if [ -z "$VERSION" ]; then
            echo "Unable to determine application version"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Application version: $VERSION"

      - name: Set image tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="latest"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $TAG"

      - name: Build and push image
        if:
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
