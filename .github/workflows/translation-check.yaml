name: Translate Build

on:
  push:
    branches: [main]
    paths:
      - 'superset-dsfr/translations/**'
  pull_request:
    branches: [main]
    paths:
      - 'superset-dsfr/translations/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install babel==2.18.0

      - name: Check translations exist
        run: |
          echo "Scanning for .po files..."
          ls -1 superset-dsfr/translations/*.po

      - name: Compile translations (pybabel)
        run: |
          # Compile each version-specific .po file
          for po in superset-dsfr/translations/*.po; do
            echo "Compiling $po"
            mkdir -p /tmp/translations-check/fr/LC_MESSAGES
            cp "$po" /tmp/translations-check/fr/LC_MESSAGES/messages.po
            pybabel compile -d /tmp/translations-check --statistics
            rm -rf /tmp/translations-check
          done
