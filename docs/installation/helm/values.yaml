ingress:
  enabled: true
  ingressClassName: nginx
  # Exemple host sur SSPCloud (https://datalab.sspcloud.fr/)
  hosts:
    - my-own-superset.lab.sspcloud.fr

initImage:
  repository: apache/superset
  tag: dockerize
  pullPolicy: IfNotPresent

# Exemple avec les images mises à disposition (https://github.com/etalab-ia/chartsgouv/pkgs/container/chartsgouv)
image:
  repository: ghcr.io/etalab-ia/chartsgouv/apache-superset
  tag: 6.1.0-0ddf08b482d4be29f139cd70519a7e2de74c2193
  pullPolicy: IfNotPresent


# -- Install additional packages and do any other bootstrap configuration in this script
# For production clusters it's recommended to build own image with this step done in CI
# @default -- see `values.yaml`
bootstrapScript: |
  #!/bin/bash

  # Exemple d'installation des packages
  # apt update && apt install -y gcc libpq-dev python3-dev pkg-config

  # if command -v uv > /dev/null 2>&1; then
  #   uv pip install --no-cache-dir -r psycopg2-binary
  # else
  #   pip install --no-cache-dir -r psycopg2-binary
  # fi;

  if [ ! -f ~/bootstrap ]; then echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap; fi


init:
  loadExamples: false
  createAdmin: true
  adminUser:
    username: admin
    firstname: Superset
    lastname: Admin
    email: admin@superset.com
    password: admin

extraSecretEnv:
  # Dans votre terminal > `openssl rand -base64 42`
  SUPERSET_SECRET_KEY: 'your_secret_key'

# Set to false if bringing your own PostgreSQL
# and complete database: section.
postgresql:
  enabled: true

# -- Database connection configuration for the Superset metadata database
database:
  # You need to change below configuration incase bringing own PostgresSQL instance and also set postgresql.enabled:false
  # -- Full database URI (overrides host/port/user/pass/name if set)
  # Example: "postgresql+psycopg2://user:pass@host:5432/dbname"
  uri: ~
  # -- Database driver used when uri is not set (default: postgresql+psycopg2 when unset;
  # legacy supersetNode.connections.db_type is honored when this is unset)
  driver: ~
  # -- Database host (default: {{ .Release.Name }}-postgresql)
  host: ~
  # -- Database port (default: 5432 when unset; legacy supersetNode.connections.db_port is honored)
  port: ~
  # -- Database user (default: superset, resolved via superset.db.user)
  user: ~
  # -- Database password (default: superset, resolved via superset.db.password)
  # ⚠️ CHANGE THIS for production
  password: ~
  # -- Database name (default: superset, resolved via superset.db.name)
  name: ~
  # -- Database SSL configuration
  ssl:
    enabled: false
    mode: require
